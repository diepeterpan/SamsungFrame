services:
  samsungframe:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: samsungframe
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - FRAME_MOCK=${FRAME_MOCK:-}
      - FRAME_FORCE_PHYSICAL=${FRAME_FORCE_PHYSICAL:-1}
      - FRAME_CONFIG_PATH=/app/config.json
    volumes:
      # Persistent configuration file
      - ../config.json:/app/config.json
      # Full host /dev passthrough for live USB hotplug & re-enumeration
      - /dev:/dev
      # Live udev hardware database access for libusb hotplug event detection
      - /run/udev:/run/udev:ro
    # Required for raw USB bulk and control endpoint transfers
    privileged: true

